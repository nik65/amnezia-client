name: Build Windows IPv6 fix

on:
  push:
    branches:
      - 'dev'
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      QT_VERSION: 6.10.1
      QIF_VERSION: 4.7
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
      - name: Mark build started
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/heads/build-status/windows-ipv6-fix" -f sha="${{ github.sha }}" --silent
          if ($LASTEXITCODE -ne 0) {
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/heads/build-status/windows-ipv6-fix" -f sha="${{ github.sha }}" -F force=true --silent
          }

      - name: Get sources
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 10

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtremoteobjects qt5compat qtshadertools'
          dir: ${{ runner.temp }}
          setup-python: 'true'
          tools: 'tools_ifw'
          set-env: 'true'
          aqtversion: '==3.3.0'
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: 'x64'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          wix extension list -g
          $wixBinDir = Join-Path $env:USERPROFILE ".dotnet\tools"
          echo "WIX_BIN_DIR=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install Conan
        run: pip install "conan==2.28.0"

      - name: Build project
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: |
          set WIX_ROOT_PATH="${{ env.USERPROFILE }}\.dotnet\tools"
          deploy\build.bat --installer all

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-Windows-IPv6-fix
          path: deploy/build/AmneziaVPN_*_windows_x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish EXE to temporary branch
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "deploy\build" -Filter "AmneziaVPN_*_windows_x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows installer EXE was not produced" }

          $savedExe = Join-Path $env:RUNNER_TEMP "AmneziaVPN-Windows-IPv6-fix.exe"
          $savedHash = Join-Path $env:RUNNER_TEMP "SHA256.txt"
          Copy-Item $exe.FullName $savedExe -Force
          $hash = (Get-FileHash $savedExe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $savedHash -Value "$hash  AmneziaVPN-Windows-IPv6-fix.exe" -Encoding ascii

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clean -fdx
          git checkout --orphan build-artifacts/windows-ipv6-fix
          git rm -rf .
          Copy-Item $savedExe "AmneziaVPN-Windows-IPv6-fix.exe" -Force
          Copy-Item $savedHash "SHA256.txt" -Force
          git add "AmneziaVPN-Windows-IPv6-fix.exe" "SHA256.txt"
          git commit -m "Publish Windows IPv6 fix installer"
          git push --force origin HEAD:refs/heads/build-artifacts/windows-ipv6-fix

# Triggered after GitHub Actions was enabled on the fork.
